name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pytest
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name BatchRename main.py
      - uses: actions/upload-artifact@v4
        with:
          name: BatchRename
          path: dist/BatchRename.exe
